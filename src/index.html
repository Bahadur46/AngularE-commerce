<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Anuvesha &amp; Co. — Luxury Gift Curations</title>
  <base href="/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Handcrafted luxury gift curations for baby, birthday, Sawan, Rakhi, wedding, anniversary, corporate and festival gifting. Premium packaging, dispatched within a day." />
  <meta name="theme-color" content="#050b09" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script>
    // Applied before first paint so a dark-mode reload never flashes white.
    (function () {
      var saved = localStorage.getItem('Kova.theme');
      var dark = saved !== 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.documentElement.classList.toggle('Kova-dark', dark);
    })();
  </script>
</head>
<body>
  <Kova-root></Kova-root>
</body>
</html>
